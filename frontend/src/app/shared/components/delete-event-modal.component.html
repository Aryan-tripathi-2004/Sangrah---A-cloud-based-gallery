<div *ngIf="isOpen" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
  <div class="w-full max-w-2xl rounded-2xl border border-red-500/30 bg-slate-950 shadow-2xl shadow-black/50">
    <div class="flex items-start justify-between border-b border-red-500/20 px-6 py-4">
      <div class="flex items-start gap-3">
        <div class="flex h-12 w-12 items-center justify-center rounded-full bg-red-500/15 text-2xl">⚠️</div>
        <div>
          <p class="text-xs uppercase tracking-[0.3em] text-red-300/80">Danger zone</p>
          <h2 class="mt-1 text-2xl font-bold text-slate-100">Delete event</h2>
        </div>
      </div>
      <button
        type="button"
        (click)="closeModal.emit()"
        class="rounded-full px-3 py-2 text-slate-400 transition hover:bg-slate-800 hover:text-slate-100"
        aria-label="Close delete modal"
      >
        ✕
      </button>
    </div>

    <div class="space-y-5 px-6 py-6">
      <div class="rounded-xl border border-red-500/30 bg-red-500/10 p-4 text-red-100">
        <p class="font-semibold">This action permanently deletes the event and its related data.</p>
        <p class="mt-1 text-sm text-red-200/80">There is no undo once deletion completes.</p>
      </div>

      <div class="rounded-xl border border-slate-800 bg-slate-900/80 p-4">
        <h3 class="text-sm font-semibold uppercase tracking-[0.2em] text-slate-400">What will be deleted</h3>
        <div class="mt-3 space-y-2 text-slate-200">
          <div class="flex items-center justify-between gap-4 rounded-lg bg-slate-800/70 px-4 py-3">
            <span>Event name</span>
            <span class="font-semibold text-slate-100">{{ eventTitle }}</span>
          </div>
          <div class="flex items-center justify-between gap-4 rounded-lg bg-slate-800/70 px-4 py-3">
            <span>Media items</span>
            <span class="font-semibold text-slate-100">{{ mediaCount }}</span>
          </div>
          <div class="flex items-center justify-between gap-4 rounded-lg bg-slate-800/70 px-4 py-3">
            <span>Collaborators</span>
            <span class="font-semibold text-slate-100">{{ collaboratorCount }}</span>
          </div>
        </div>
      </div>

      <label class="flex items-start gap-3 rounded-xl border border-red-500/20 bg-red-500/5 px-4 py-4 text-slate-100">
        <input
          [(ngModel)]="confirmed"
          type="checkbox"
          class="mt-1 h-4 w-4 rounded border-slate-600 bg-slate-800 text-red-500 focus:ring-red-500"
        />
        <span>
          <span class="block font-semibold">I understand this event will be permanently deleted.</span>
          <span class="block text-sm text-slate-400">You must confirm this warning before the delete button is enabled.</span>
        </span>
      </label>

      <div class="flex flex-col-reverse gap-3 border-t border-slate-800 pt-5 sm:flex-row">
        <button
          type="button"
          (click)="closeModal.emit()"
          class="flex-1 rounded-xl border border-slate-700 bg-slate-900 px-4 py-3 font-semibold text-slate-200 transition hover:bg-slate-800"
        >
          Cancel
        </button>
        <button
          type="button"
          (click)="confirmDelete.emit()"
          [disabled]="!canDelete()"
          class="flex-1 rounded-xl bg-gradient-to-r from-red-600 to-rose-500 px-4 py-3 font-semibold text-white transition hover:from-red-500 hover:to-rose-400 disabled:cursor-not-allowed disabled:from-slate-700 disabled:to-slate-700"
        >
          <span *ngIf="!isDeleting">Delete Event</span>
          <span *ngIf="isDeleting">Deleting...</span>
        </button>
      </div>
    </div>
  </div>
</div>
