<div
  class="group relative break-inside-avoid bg-slate-800/50 border border-slate-700/30 rounded-lg overflow-hidden cursor-pointer transition-all hover:shadow-lg hover:bg-slate-800 hover:-translate-y-1"
  >
  <!-- Image/Video Thumbnail -->
  @if (isImage) {
    <img
      [src]="fileUrl"
      [alt]="media.originalFileName"
      class="w-full h-auto cursor-pointer"
      (click)="onPreview()"
      (load)="onImageLoad()"
      (error)="onImageError()"
      />
  }
  @if (isVideo) {
    <video
      [src]="fileUrl"
      class="w-full h-auto cursor-pointer"
      (click)="onPreview()"
      (loadedmetadata)="onImageLoad()"
      (error)="onImageError()"
    ></video>
  }

  <!-- Fallback Emoji if image fails to load -->
  @if (!imageLoaded) {
    <div class="w-full py-24 flex items-center justify-center bg-gradient-to-br from-slate-700 to-slate-800">
      <span class="text-5xl">
        @if (isImage) {
          <span>🖼️</span>
        }
        @if (isVideo) {
          <span>🎬</span>
        }
      </span>
    </div>
  }

  <!-- Size Badge -->
  <div class="absolute top-2 right-2 bg-black/60 px-2 py-1 rounded text-xs font-medium text-slate-300">
    {{ formatSize(media.sizeBytes) }}
  </div>

  <!-- Date Badge -->
  <div class="absolute bottom-2 left-2 text-xs text-slate-300 bg-black/60 px-2 py-1 rounded">
    {{ media.uploadedAt | date: 'MMM d' }}
  </div>
</div>
