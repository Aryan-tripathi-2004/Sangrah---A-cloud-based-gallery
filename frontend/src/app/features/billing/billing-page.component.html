<app-layout>
  <div class="max-w-7xl mx-auto px-4 py-8">
    <!-- Page Title -->
    <div class="mb-8">
      <h1 class="text-3xl font-bold text-slate-100">💰 Billing</h1>
      <p class="text-slate-400 mt-2">Manage your invoices, payments, and billing settings</p>
    </div>

    <!-- Error Message -->
    <div *ngIf="(error$ | async) as error" class="mb-6 bg-red-500/10 border border-red-500/30 text-red-400 p-4 rounded-lg flex justify-between items-center">
      <span>{{ error }}</span>
      <button (click)="dismissError()" class="text-red-400 hover:text-red-300 text-xl">✕</button>
    </div>

    <!-- Loading State -->
    <div *ngIf="(loading$ | async)" class="text-center py-12">
      <div class="text-slate-400">Loading...</div>
    </div>

    <!-- Tab Navigation -->
    <div class="mb-8 border-b border-slate-700">
      <div class="flex gap-4 overflow-x-auto">
        <button
          *ngFor="let tab of tabs"
          [ngClass]="{
            'text-blue-400 border-b-2 border-blue-500': activeTab === tab.id,
            'text-slate-400 hover:text-slate-300': activeTab !== tab.id
          }"
          class="px-4 py-3 font-semibold whitespace-nowrap transition-colors"
          (click)="switchTab(tab.id)">
          {{ tab.label }}
        </button>
      </div>
    </div>

    <!-- Tab Content -->
    <div class="space-y-6">
      <!-- Dashboard Tab -->
      <div *ngIf="activeTab === 'dashboard'">
        <app-billing-summary />
      </div>

      <!-- Invoices Tab -->
      <div *ngIf="activeTab === 'invoices'">
        <app-invoice-list
          (invoiceSelected)="openInvoiceDetail($event)"
          (payInvoice)="onPayInvoice($event)" />
      </div>

      <!-- Payments Tab -->
      <div *ngIf="activeTab === 'payments'">
        <app-payment-history />
      </div>

      <!-- Settings Tab -->
      <div *ngIf="activeTab === 'settings'">
        <app-billing-settings />
      </div>
    </div>

    <!-- Invoice Detail Modal -->
    <app-invoice-detail-modal
      *ngIf="showInvoiceModal && selectedInvoice"
      [invoice]="selectedInvoice"
      (closeModal)="closeInvoiceModal()"
      (payInvoice)="onPayInvoice($event)" />

    <!-- Stripe Payment Modal -->
    <app-stripe-payment-modal
      *ngIf="showStripeModal && stripeInvoiceId"
      [invoiceId]="stripeInvoiceId"
      (closeModal)="onStripeModalClose()"
      (paymentSuccess)="onStripePaymentSuccess()" />
  </div>
</app-layout>
