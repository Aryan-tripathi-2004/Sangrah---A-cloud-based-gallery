<div class="space-y-4">
  <div *ngFor="let payment of (payments$ | async)" class="bg-slate-800/30 border border-slate-700/50 rounded-xl p-4">
    <div class="flex justify-between items-start mb-3">
      <div>
        <div class="font-mono text-sm text-slate-400">Invoice: {{ payment.invoiceId }}</div>
        <div class="text-sm text-slate-400">{{ payment.transactionDate | date: 'MMM d, yyyy h:mm a' }}</div>
      </div>
      <app-status-badge [status]="getStatusLabel(payment.status)" />
    </div>

    <div class="text-2xl font-bold text-slate-100 mb-4">
      {{ payment.amount | currency }}
    </div>

    <!-- Failed Payment Details -->
    <div *ngIf="payment.status === 'FAILED'" class="bg-red-500/10 border border-red-500/30 rounded-lg p-4 mb-4">
      <div class="text-sm text-red-400 mb-3">
        ❌ Payment Failed: {{ payment.failureReason || 'Unknown reason' }}
      </div>
      <button
        (click)="retryPayment(payment.id)"
        class="w-full px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-100 rounded font-semibold text-sm transition-colors">
        🔄 Retry Payment (Coming soon)
      </button>
    </div>

    <!-- Success Payment Details -->
    <div *ngIf="payment.status === 'SUCCESS'" class="bg-green-500/10 border border-green-500/30 rounded-lg p-3">
      <div class="text-xs text-green-400">
        ✅ Payment successful on {{ payment.transactionDate | date: 'MMM d, yyyy' }}
      </div>
    </div>
  </div>

  <!-- Empty State -->
  <div *ngIf="((payments$ | async) || []).length === 0" class="text-center py-12">
    <div class="text-3xl mb-2">💳</div>
    <div class="text-slate-400">No payment history yet</div>
  </div>
</div>
