<div class="flex flex-col items-center justify-between h-full py-4 space-y-6">
  <!-- Top: Navigation Icons -->
  <div class="flex flex-col items-center gap-3 sm:gap-4">
    <!-- Events Tab (Grid Icon) -->
    <button
      type="button"
      (click)="selectTab('events')"
      title="Events"
      aria-label="Events"
      [class.text-white]="activeTab() === 'events'"
      [class.bg-slate-800]="activeTab() === 'events'"
      [class.shadow-lg]="activeTab() === 'events'"
      [class.text-slate-500]="activeTab() !== 'events'"
      class="p-2.5 sm:p-3 rounded-2xl transition-all duration-200 hover:text-white hover:bg-slate-800/60 focus:outline-none group relative"
    >
      @if (activeTab() === 'events') {
        <span class="absolute -left-1 sm:-left-1.5 top-1/2 -translate-y-1/2 w-1 h-5 rounded-r-full bg-gradient-to-b from-blue-500 to-indigo-500"></span>
      }
      <!-- 3x3 Grid Icon -->
      <svg class="w-5 h-5 transition-transform duration-200 group-hover:scale-110" viewBox="0 0 24 24" fill="currentColor">
        <rect x="3" y="3" width="4" height="4" rx="0.75" />
        <rect x="10" y="3" width="4" height="4" rx="0.75" />
        <rect x="17" y="3" width="4" height="4" rx="0.75" />
        <rect x="3" y="10" width="4" height="4" rx="0.75" />
        <rect x="10" y="10" width="4" height="4" rx="0.75" />
        <rect x="17" y="10" width="4" height="4" rx="0.75" />
        <rect x="3" y="17" width="4" height="4" rx="0.75" />
        <rect x="10" y="17" width="4" height="4" rx="0.75" />
        <rect x="17" y="17" width="4" height="4" rx="0.75" />
      </svg>
    </button>

    <!-- Gallery Tab (Photo Frame Icon) -->
    <button
      type="button"
      (click)="selectTab('gallery')"
      title="Gallery Media"
      aria-label="Gallery Media"
      [class.text-white]="activeTab() === 'gallery'"
      [class.bg-slate-800]="activeTab() === 'gallery'"
      [class.shadow-lg]="activeTab() === 'gallery'"
      [class.text-slate-500]="activeTab() !== 'gallery'"
      class="p-2.5 sm:p-3 rounded-2xl transition-all duration-200 hover:text-white hover:bg-slate-800/60 focus:outline-none group relative"
    >
      @if (activeTab() === 'gallery') {
        <span class="absolute -left-1 sm:-left-1.5 top-1/2 -translate-y-1/2 w-1 h-5 rounded-r-full bg-gradient-to-b from-blue-500 to-indigo-500"></span>
      }
      <!-- Media / Photo Frame Icon -->
      <svg class="w-5 h-5 transition-transform duration-200 group-hover:scale-110" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <rect x="3" y="3" width="18" height="18" rx="2" stroke-width="2" />
        <circle cx="8.5" cy="8.5" r="1.5" fill="currentColor" stroke="none" />
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 15l-5-5L5 21" />
      </svg>
    </button>

    <!-- Saved Tab (Bookmark Icon) -->
    <button
      type="button"
      (click)="selectTab('saved')"
      title="Saved Items"
      aria-label="Saved Items"
      [class.text-white]="activeTab() === 'saved'"
      [class.bg-slate-800]="activeTab() === 'saved'"
      [class.shadow-lg]="activeTab() === 'saved'"
      [class.text-slate-500]="activeTab() !== 'saved'"
      class="p-2.5 sm:p-3 rounded-2xl transition-all duration-200 hover:text-white hover:bg-slate-800/60 focus:outline-none group relative"
    >
      @if (activeTab() === 'saved') {
        <span class="absolute -left-1 sm:-left-1.5 top-1/2 -translate-y-1/2 w-1 h-5 rounded-r-full bg-gradient-to-b from-blue-500 to-indigo-500"></span>
      }
      <!-- Bookmark Icon -->
      <svg class="w-5 h-5 transition-transform duration-200 group-hover:scale-110" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z" />
      </svg>
    </button>
  </div>

  <!-- Bottom: Action (+) Button matching reference image -->
  <div class="mt-auto pt-4">
    <a
      [routerLink]="activeTab() === 'events' ? '/event/create' : '/gallery'"
      [title]="activeTab() === 'events' ? 'Create Event' : 'Add to Gallery'"
      class="w-10 h-10 sm:w-11 sm:h-11 rounded-2xl bg-gradient-to-tr from-pink-500/20 via-purple-500/20 to-indigo-500/20 border border-pink-500/40 hover:border-pink-500 text-pink-400 hover:text-white flex items-center justify-center text-xl shadow-lg transition-all duration-200 hover:scale-105"
    >
      +
    </a>
  </div>
</div>
