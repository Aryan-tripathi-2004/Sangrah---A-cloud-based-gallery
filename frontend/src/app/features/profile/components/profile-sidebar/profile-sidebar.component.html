<aside class="w-full lg:w-80 flex-shrink-0 space-y-6">
  <!-- Profile Card -->
  <div class="bg-slate-850/80 border border-slate-800 rounded-3xl p-6 sm:p-7 shadow-xl backdrop-blur-md space-y-6">
    <!-- Avatar Section -->
    <div class="text-center space-y-3">
      <app-avatar-upload
        [avatarUrl]="avatarDisplayUrl()"
        [displayName]="user()?.displayName || 'User'"
        [isUploading]="isUploadingAvatar()"
        (fileSelected)="avatarSelected.emit($event)"
      />

      <!-- Display Name & Handle -->
      <div class="pt-1">
        <h2 class="text-xl sm:text-2xl font-black text-white tracking-tight">
          {{ user()?.displayName || 'Sangrah Creator' }}
        </h2>
        <p class="text-xs text-slate-400 font-medium mt-0.5 truncate max-w-[260px] mx-auto">
          {{ user()?.email }}
        </p>

        <!-- "Member Since" Badge -->
        <div class="inline-flex items-center gap-1.5 px-3 py-1 mt-2.5 rounded-full bg-slate-800/80 border border-slate-700/60 text-[11px] font-semibold text-slate-300">
          <span class="text-indigo-400">✦</span>
          <span>Member since {{ memberSince() }}</span>
        </div>
      </div>
    </div>

    <!-- Stats Block -->
    <app-profile-stats
      [eventsCount]="eventsCount()"
      [galleryCount]="galleryCount()"
    />

    <!-- Bio Section -->
    <app-bio-edit
      [bio]="user()?.bio"
      [isSaving]="isSavingBio()"
      (bioSaved)="bioSaved.emit($event)"
    />

    <!-- Storage Progress Bar -->
    <div class="pt-2 border-t border-slate-800/80 space-y-2">
      <div class="flex items-center justify-between text-xs">
        <span class="font-bold text-slate-400 uppercase tracking-wider text-[10px]">Cloud Storage</span>
        <span class="font-semibold text-slate-300 text-[11px]">{{ formattedStorage() }} / 5 GB</span>
      </div>
      <div class="w-full h-2 rounded-full bg-slate-800 overflow-hidden">
        <div
          class="h-full rounded-full bg-gradient-to-r from-blue-500 via-indigo-500 to-purple-500 transition-all duration-500"
          [style.width.%]="storagePercent()"
        ></div>
      </div>
      <div class="text-right text-[10px] text-slate-500">
        {{ storagePercent() }}% capacity utilized
      </div>
    </div>

    <!-- Account Settings Link -->
    <div class="pt-2 border-t border-slate-800/80">
      <a
        routerLink="/settings"
        class="w-full flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl bg-slate-800/60 hover:bg-slate-700/60 border border-slate-700/60 text-slate-300 hover:text-white font-medium text-xs transition duration-200"
      >
        <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
        <span>Account Settings & Privacy</span>
      </a>
    </div>
  </div>
</aside>
