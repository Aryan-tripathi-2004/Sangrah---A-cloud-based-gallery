spring.application.name=Auth
server.port=${AUTH_PORT:8081}
spring.data.mongodb.uri=${AUTH_MONGODB_URI:mongodb://localhost:27017/sangrah_auth}

# JWT Configuration (IMPORTANT: Change JWT_SECRET in production environment variables)
jwt.secret=${JWT_SECRET:sangrah_secret_key_for_jwt_token_validation_please_change_in_production}
jwt.access-token-expiration-seconds=${JWT_ACCESS_TOKEN_EXPIRY:900}
jwt.refresh-token-expiration-seconds=${JWT_REFRESH_TOKEN_EXPIRY:604800}
jwt.default-role=${JWT_DEFAULT_ROLE:USER}

# Active session limit per user
auth.session.max-active=${AUTH_SESSION_MAX_ACTIVE:5}

# Security Configuration
security.header.user-id=${SECURITY_HEADER_USER_ID:X-User-Id}

# OpenAPI/Swagger Configuration
springdoc.api-docs.path=${SPRINGDOC_API_DOCS_PATH:/api-docs}
springdoc.swagger-ui.path=${SPRINGDOC_SWAGGER_UI_PATH:/swagger-ui}
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Logging Configuration
logging.level.root=${LOGGING_LEVEL_ROOT:INFO}
logging.level.com.example.Auth=${LOGGING_LEVEL_AUTH:DEBUG}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Eureka Service Discovery Configuration
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=${EUREKA_REGISTER_WITH_EUREKA:true}
eureka.client.fetch-registry=${EUREKA_FETCH_REGISTRY:true}
eureka.instance.prefer-ip-address=${EUREKA_INSTANCE_PREFER_IP_ADDRESS:true}
eureka.instance.health-check-url-path=${EUREKA_INSTANCE_HEALTH_CHECK_PATH:/actuator/health}
eureka.instance.status-page-url-path=${EUREKA_INSTANCE_STATUS_PAGE_PATH:/actuator/info}

# Server Configuration
server.servlet.context-path=/
server.error.include-message=always
server.error.include-binding-errors=always

# Media Service Configuration
media.service.url=${MEDIA_SERVICE_URL:http://localhost:8087}

