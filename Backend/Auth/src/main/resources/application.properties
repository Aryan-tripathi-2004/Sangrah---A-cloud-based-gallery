spring.application.name=Auth
server.port=8081

# H2 in-memory database (for development; replace with MySQL for production)
spring.datasource.url=jdbc:h2:mem:authdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true

# JWT Configuration
# SECURITY: Always set the JWT_SECRET_KEY environment variable in production.
# The fallback below is for local development ONLY and must never be used in production.
# Generate a secure key with: openssl rand -base64 32
jwt.secret-key=${JWT_SECRET_KEY:dGhpc2lzYXZlcnlzZWN1cmVzZWNyZXRrZXlmb3JzYW5ncmFoYXBwbGljYXRpb24=}
jwt.expiration-ms=900000
jwt.refresh-expiration-ms=2592000000
