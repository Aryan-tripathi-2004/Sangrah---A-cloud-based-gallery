spring.application.name=${SPRING_APPLICATION_NAME:eureka-registry-service}
server.port=${EUREKA_PORT:8761}

# Eureka Server Configuration
eureka.instance.hostname=${EUREKA_HOSTNAME:localhost}
eureka.client.registerWithEureka=${EUREKA_CLIENT_REGISTER_WITH_EUREKA:false}
eureka.client.fetchRegistry=${EUREKA_CLIENT_FETCH_REGISTRY:false}
eureka.client.serviceUrl.defaultZone=${EUREKA_SERVER_URL:http://${eureka.instance.hostname}:${server.port}/eureka/}

# Server Configuration
server.servlet.context-path=${SERVER_SERVLET_CONTEXT_PATH:/}
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info}

# Logging
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n
