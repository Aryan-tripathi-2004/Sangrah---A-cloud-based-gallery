spring.application.name=Cloud
server.port=8083

# H2 in-memory database (for development)
spring.datasource.url=jdbc:h2:mem:clouddb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true

# JWT secret key – must match the key configured in the Auth service
# SECURITY: Always set the JWT_SECRET_KEY environment variable in production.
# The fallback below is for local development ONLY and must never be used in production.
jwt.secret-key=${JWT_SECRET_KEY:dGhpc2lzYXZlcnlzZWN1cmVzZWNyZXRrZXlmb3JzYW5ncmFoYXBwbGljYXRpb24=}
