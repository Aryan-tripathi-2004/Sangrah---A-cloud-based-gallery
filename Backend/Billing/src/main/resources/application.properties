spring.application.name=Billing
server.port=${BILLING_PORT:8084}
spring.data.mongodb.uri=${BILLING_MONGODB_URI:mongodb://localhost:27017/sangrah_billing}

# Note: H2 database is optional, primary persistence is MongoDB
spring.datasource.url=jdbc:h2:mem:sangrah_billing;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Eureka Service Discovery Configuration
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.health-check-url-path=/actuator/health
eureka.instance.status-page-url-path=/actuator/info

# OpenAPI/Swagger Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Logging Configuration
logging.level.root=INFO
logging.level.com.example.Billing=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Server Configuration
server.servlet.context-path=/
server.error.include-message=always
server.error.include-binding-errors=always

# ============================================================
# INTER-SERVICE COMMUNICATION (Feign Client)
# ============================================================
# Gallery Service URL for querying storage ledger
gallery.service.url=${GALLERY_SERVICE_URL:http://localhost:8082}
auth.service.url=${AUTH_SERVICE_URL:http://localhost:8081}

# Email Service URL for sending email notifications
email.service.url=${EMAIL_SERVICE_URL:http://localhost:8086}

# Enable Jackson deserialization of Spring Data Page for Feign clients
spring.cloud.openfeign.autoconfiguration.jackson.page.enabled=true
spring.cloud.openfeign.autoconfiguration.jackson.page.sort.enabled=true

# ============================================================
# STRIPE CONFIGURATION
# ============================================================
# Stripe API Key - for payment processing
# Get from: Stripe Dashboard → Developers → API Keys → Secret key
stripe.api.key=${STRIPE_API_KEY:}

# Webhook signing secret - prevents CSRF attacks
# Get from: Stripe Dashboard → Developers → Webhooks → Signing Secret
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:}

# Webhook processing timeout (5 minutes = 300000 milliseconds)
# If webhook processing exceeds this, we still return 200 OK to Stripe
# (to prevent unnecessary retries)
webhook.timeout.ms=${WEBHOOK_TIMEOUT_MS:300000}

# Max age of webhook event (10 minutes = 600 seconds)
# Prevents replay attacks and stale event processing
webhook.event.max.age=${WEBHOOK_EVENT_MAX_AGE:600}

# ============================================================
# SCHEDULING CONFIGURATION
# ============================================================
# Enable @Scheduled annotations for monthly invoice generation
spring.batch.job.enabled=${ENABLE_BATCH_JOBS:true}
scheduling.enabled=${SCHEDULING_ENABLED:true}

# ============================================================
# BILLING BUSINESS CONFIGURATION
# ============================================================
# Currency for Stripe payment processing (ISO 4217 code, lowercase)
billing.currency=${BILLING_CURRENCY:usd}

# Stripe publishable key (safe to expose to frontend)
stripe.publishable.key=${STRIPE_PUBLISHABLE_KEY:}

# Default Stripe customer address (India compliance defaults)
billing.customer.default.country=${BILLING_DEFAULT_COUNTRY:IN}
billing.customer.default.postal-code=${BILLING_DEFAULT_POSTAL_CODE:000000}

# Storage limit per user (bytes) — 5 GB default
billing.storage.limit.bytes=${BILLING_STORAGE_LIMIT_BYTES:5368709120}

# Storage rate per GB-day (Financial rate)
billing.storage-rate-per-gb-day=${BILLING_STORAGE_RATE_PER_GB_DAY:0.01}

# Invoice due date (days after issue date)
billing.invoice.due-days=${BILLING_INVOICE_DUE_DAYS:15}

# Default cost alert threshold (USD)
billing.default.cost-alert-threshold=${BILLING_DEFAULT_COST_ALERT_THRESHOLD:100.0}

# Fallback email when user email cannot be fetched from Auth service
billing.fallback.email=${BILLING_FALLBACK_EMAIL:billing@sangrah.com}

# Payment retry configuration
billing.payment.retry.max-attempts=${BILLING_PAYMENT_RETRY_MAX_ATTEMPTS:3}
billing.payment.retry.interval-hours=${BILLING_PAYMENT_RETRY_INTERVAL_HOURS:24}
# How often the auto-retry scheduler runs (milliseconds). Default: 1 hour.
billing.payment.retry.check-interval-ms=${BILLING_PAYMENT_RETRY_CHECK_INTERVAL_MS:3600000}
