spring.application.name=Billing
server.port=8084

# H2 in-memory database (for development; replace with MySQL for production)
spring.datasource.url=jdbc:h2:mem:billingdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true

# Stripe Configuration
# Set the STRIPE_API_KEY environment variable to your Stripe secret key.
# SECURITY: Never hard-code API keys in source code.
stripe.api-key=${STRIPE_API_KEY:sk_test_placeholder_replace_with_real_key}
# Set STRIPE_WEBHOOK_SECRET to validate incoming webhook signatures (recommended for production)
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
