# Spring Boot Configuration
spring.application.name=MediaService
server.port=8087

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/sangrah_media
spring.data.mongodb.auto-index-creation=true

# Eureka Service Discovery
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.instance.hostname=localhost
eureka.instance.instance-id=${spring.application.name}:${server.port}

# File Upload Configuration
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
spring.webflux.multipart.max-file-size=500MB
spring.webflux.multipart.max-in-memory-size=10485760

# Media Storage Configuration
sangrah.storage.root=./storage

# JWT Configuration
jwt.secret=${JWT_SECRET:your-secret-key-change-in-production}
jwt.expiration=3600000

# Logging
logging.level.root=INFO
logging.level.com.example.Media=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# OpenAPI/Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
