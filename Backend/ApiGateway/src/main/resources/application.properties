spring.application.name=ApiGateway
server.port=${GATEWAY_PORT:8080}

spring.main.web-application-type=reactive
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Eureka Service Discovery Configuration
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.health-check-url-path=/actuator/health
eureka.instance.status-page-url-path=/actuator/info

spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://AUTH
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/auth/**,/api/v1/users/**

spring.cloud.gateway.routes[1].id=gallery-service
spring.cloud.gateway.routes[1].uri=lb://GALLERY
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/gallery/**

spring.cloud.gateway.routes[2].id=event-service
spring.cloud.gateway.routes[2].uri=lb://EVENT
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/events/**

spring.cloud.gateway.routes[3].id=media-service
spring.cloud.gateway.routes[3].uri=lb://MediaService
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/v1/media/**

spring.cloud.gateway.routes[4].id=billing-service
spring.cloud.gateway.routes[4].uri=lb://BILLING
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/v1/billing/**

spring.cloud.gateway.routes[5].id=notification-service
spring.cloud.gateway.routes[5].uri=lb://NOTIFICATION
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/v1/notifications/**

# JWT Configuration for Gateway
jwt.secret=${JWT_SECRET:sangrah_secret_key_for_jwt_token_validation_please_change_in_production}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Multipart Upload Configuration for Reactive Gateway
# Max file size: 500MB (as per Gallery controller)
spring.webflux.multipart.max-in-memory-size=500MB
spring.webflux.multipart.max-parts=100

# Logging Configuration
logging.level.root=INFO
logging.level.com.example.ApiGateway=DEBUG
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.web.server.adapter.HttpWebHandlerAdapter=TRACE
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Server Configuration
server.servlet.context-path=/
server.compression.enabled=true
server.error.include-message=always
