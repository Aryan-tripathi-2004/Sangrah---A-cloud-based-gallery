spring.application.name=${SPRING_APPLICATION_NAME:ApiGateway}
server.port=${GATEWAY_PORT:8080}

spring.main.web-application-type=${SPRING_MAIN_WEB_APPLICATION_TYPE:reactive}
spring.cloud.gateway.discovery.locator.enabled=${GATEWAY_DISCOVERY_LOCATOR_ENABLED:true}
spring.cloud.gateway.discovery.locator.lower-case-service-id=${GATEWAY_DISCOVERY_LOCATOR_LOWERCASE:true}

# Eureka Service Discovery Configuration
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=${EUREKA_CLIENT_REGISTER_WITH_EUREKA:true}
eureka.client.fetch-registry=${EUREKA_CLIENT_FETCH_REGISTRY:true}
eureka.instance.prefer-ip-address=${EUREKA_INSTANCE_PREFER_IP_ADDRESS:true}
eureka.instance.health-check-url-path=${EUREKA_INSTANCE_HEALTH_CHECK_PATH:/actuator/health}
eureka.instance.status-page-url-path=${EUREKA_INSTANCE_STATUS_PAGE_PATH:/actuator/info}

# Route 0: Auth Service
spring.cloud.gateway.routes[0].id=${AUTH_SERVICE_ROUTE_ID:auth-service}
spring.cloud.gateway.routes[0].uri=${AUTH_SERVICE_URI:lb://AUTH}
spring.cloud.gateway.routes[0].predicates[0]=${AUTH_SERVICE_PATH_PREDICATE:Path=/api/v1/auth/**,/api/v1/users/**}

# Route 1: Gallery Service
spring.cloud.gateway.routes[1].id=${GALLERY_SERVICE_ROUTE_ID:gallery-service}
spring.cloud.gateway.routes[1].uri=${GALLERY_SERVICE_URI:lb://GALLERY}
spring.cloud.gateway.routes[1].predicates[0]=${GALLERY_SERVICE_PATH_PREDICATE:Path=/api/v1/gallery/**}

# Route 2: Event Service
spring.cloud.gateway.routes[2].id=${EVENT_SERVICE_ROUTE_ID:event-service}
spring.cloud.gateway.routes[2].uri=${EVENT_SERVICE_URI:lb://EVENT}
spring.cloud.gateway.routes[2].predicates[0]=${EVENT_SERVICE_PATH_PREDICATE:Path=/api/v1/events/**}

# Route 3: Media Service
spring.cloud.gateway.routes[3].id=${MEDIA_SERVICE_ROUTE_ID:media-service}
spring.cloud.gateway.routes[3].uri=${MEDIA_SERVICE_URI:lb://MediaService}
spring.cloud.gateway.routes[3].predicates[0]=${MEDIA_SERVICE_PATH_PREDICATE:Path=/api/v1/media/**}

# Route 4: Billing Service
spring.cloud.gateway.routes[4].id=${BILLING_SERVICE_ROUTE_ID:billing-service}
spring.cloud.gateway.routes[4].uri=${BILLING_SERVICE_URI:lb://BILLING}
spring.cloud.gateway.routes[4].predicates[0]=${BILLING_SERVICE_PATH_PREDICATE:Path=/api/v1/billing/**}

# Route 5: Notification Service
spring.cloud.gateway.routes[5].id=${NOTIFICATION_SERVICE_ROUTE_ID:notification-service}
spring.cloud.gateway.routes[5].uri=${NOTIFICATION_SERVICE_URI:lb://NOTIFICATION}
spring.cloud.gateway.routes[5].predicates[0]=${NOTIFICATION_SERVICE_PATH_PREDICATE:Path=/api/v1/notifications/**}

# JWT Configuration for Gateway
jwt.secret=${JWT_SECRET:sangrah_secret_key_for_jwt_token_validation_please_change_in_production}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.claim.role-key=${JWT_CLAIM_ROLE_KEY:role}
jwt.claim.email-key=${JWT_CLAIM_EMAIL_KEY:email}
jwt.claim.type-key=${JWT_CLAIM_TYPE_KEY:type}
gateway.security.jwt.expected-type=${GATEWAY_SECURITY_JWT_EXPECTED_TYPE:ACCESS}

# Multipart Upload Configuration for Reactive Gateway
# Max file size: 500MB (as per Gallery controller)
spring.webflux.multipart.max-in-memory-size=${GATEWAY_MULTIPART_MAX_IN_MEMORY_SIZE:500MB}
spring.webflux.multipart.max-parts=${GATEWAY_MULTIPART_MAX_PARTS:100}

# ========================================================================
# Gateway Security Properties (12-Factor externalized configuration)
# ========================================================================

# CORS Allowed Origins
gateway.security.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000,http://127.0.0.1:4200,http://127.0.0.1:3000}

# Public endpoints that bypass JWT authentication (prefix-matched)
gateway.security.open-endpoints=${GATEWAY_OPEN_ENDPOINTS:/api/v1/auth/register,/api/v1/auth/login,/api/v1/auth/token/refresh,/api/v1/auth/token/validate,/swagger-ui/,/v3/api-docs/,/health,/actuator/}

# Role-based access control: route prefix -> allowed roles
gateway.security.route-roles./api/v1/gallery=${GATEWAY_ROLE_GALLERY:USER,ADMIN}
gateway.security.route-roles./api/v1/media=${GATEWAY_ROLE_MEDIA:USER,ADMIN}
gateway.security.route-roles./api/v1/events=${GATEWAY_ROLE_EVENTS:USER,ADMIN}
gateway.security.route-roles./api/v1/billing=${GATEWAY_ROLE_BILLING:USER,ADMIN}
gateway.security.route-roles./api/v1/notifications=${GATEWAY_ROLE_NOTIFICATIONS:USER,ADMIN}
gateway.security.route-roles./api/v1/admin/=${GATEWAY_ROLE_ADMIN:ADMIN}

# Additional CORS Configuration (consumed by SecurityConfig)
gateway.security.cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,HEAD,POST,PUT,DELETE,OPTIONS,PATCH}
gateway.security.cors.allowed-headers=${CORS_ALLOWED_HEADERS:Origin,X-Requested-With,Content-Type,Accept,Authorization,X-CSRF-TOKEN}
gateway.security.cors.exposed-headers=${CORS_EXPOSED_HEADERS:Authorization,Content-Type}
gateway.security.cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:true}
gateway.security.cors.max-age=${CORS_MAX_AGE:3600}
gateway.security.cors.path-pattern=${CORS_PATH_PATTERN:/api/**}
gateway.security.allowed-methods=${CORS_ALLOWED_METHODS:GET,HEAD,POST,PUT,DELETE,OPTIONS,PATCH}
gateway.security.allowed-headers=${CORS_ALLOWED_HEADERS:Origin,X-Requested-With,Content-Type,Accept,Authorization,X-CSRF-TOKEN}
gateway.security.exposed-headers=${CORS_EXPOSED_HEADERS:Authorization,Content-Type}
gateway.security.allow-credentials=${CORS_ALLOW_CREDENTIALS:true}
gateway.security.max-age=${CORS_MAX_AGE:3600}
gateway.security.cors-path-pattern=${CORS_PATH_PATTERN:/api/**}

# Gateway Identity Header & Authentication Filter Configuration (consumed by AuthenticationFilter)
gateway.security.header.user-id=${GATEWAY_HEADER_USER_ID:X-User-Id}
gateway.security.header.user-email=${GATEWAY_HEADER_USER_EMAIL:X-User-Email}
gateway.security.auth.bearer-prefix=${GATEWAY_BEARER_PREFIX:Bearer }
gateway.security.auth.token-query-param=${GATEWAY_TOKEN_QUERY_PARAM:token}
gateway.security.filter-order=${GATEWAY_FILTER_ORDER:-1}

# ========================================================================
# Logging Configuration
# ========================================================================
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.example.ApiGateway=${LOG_LEVEL_APIGATEWAY:DEBUG}
logging.level.org.springframework.cloud.gateway=${LOG_LEVEL_SPRING_GATEWAY:DEBUG}
logging.level.org.springframework.web.server.adapter.HttpWebHandlerAdapter=${LOG_LEVEL_WEB_HANDLER:TRACE}
logging.pattern.console=${LOG_PATTERN_CONSOLE:%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n}
logging.pattern.file=${LOG_PATTERN_FILE:%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n}

# Server Configuration
server.servlet.context-path=${SERVER_SERVLET_CONTEXT_PATH:/}
server.compression.enabled=${SERVER_COMPRESSION_ENABLED:true}
server.error.include-message=${SERVER_ERROR_INCLUDE_MESSAGE:always}
