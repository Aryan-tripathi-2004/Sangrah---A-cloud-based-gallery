spring.application.name=Email
spring.config.import=optional:file:.env[.properties]
server.port=${EMAIL_PORT:8086}
spring.data.mongodb.uri=${EMAIL_MONGODB_URI:mongodb://localhost:27017/sangrah_email}
spring.data.mongodb.auto-index-creation=${SPRING_DATA_MONGODB_AUTO_INDEX_CREATION:true}

# SMTP Configuration - Gmail
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8

# Detailed logging for SMTP
logging.level.org.springframework.mail.javamail=${LOGGING_LEVEL_SPRING_MAIL:DEBUG}
logging.level.jakarta.mail=${LOGGING_LEVEL_JAKARTA_MAIL:DEBUG}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_SMTP_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_SMTP_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_SMTP_WRITE_TIMEOUT:5000}
spring.mail.properties.mail.debug=${MAIL_DEBUG:false}

# Service configuration
app.email.from=${APP_EMAIL_FROM:noreply@sangrah.com}
app.email.from.name=${APP_EMAIL_FROM_NAME:Sangrah Cloud Storage}
app.email.support=${APP_EMAIL_SUPPORT:support@sangrah.com}
app.frontend.url=${APP_FRONTEND_URL:https://app.sangrah.com}

# Eureka Configuration
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=${EUREKA_REGISTER_WITH_EUREKA:true}
eureka.client.fetch-registry=${EUREKA_FETCH_REGISTRY:true}
eureka.instance.prefer-ip-address=${EUREKA_INSTANCE_PREFER_IP_ADDRESS:true}
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}
eureka.instance.instance-id=${eureka.instance.hostname}:${spring.application.name}:${server.port}

# Logging
logging.level.root=${LOGGING_LEVEL_ROOT:INFO}
logging.level.com.example.Email=${LOGGING_LEVEL_EMAIL:DEBUG}

# Reconciliation Scheduler for PENDING Zombie Emails
app.email.reconciliation.enabled=${APP_EMAIL_RECONCILIATION_ENABLED:true}
app.email.reconciliation.cron=${APP_EMAIL_RECONCILIATION_CRON:0 */5 * * * *}
app.email.reconciliation.threshold-minutes=${APP_EMAIL_RECONCILIATION_THRESHOLD_MINUTES:5}
app.email.reconciliation.max-retries=${APP_EMAIL_RECONCILIATION_MAX_RETRIES:3}

