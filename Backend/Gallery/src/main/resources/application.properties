spring.application.name=Gallery
server.port=${GALLERY_PORT:8082}
spring.data.mongodb.uri=${GALLERY_MONGODB_URI:mongodb://localhost:27017/sangrah_gallery}

# Storage Configuration (12-Factor: use environment variables)

# Multipart Upload Configuration
# Max file size: 500MB (as per controller validation)
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:500MB}
# Max request size: 500MB (for form data)
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:500MB}

# OpenAPI/Swagger Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# JWT Configuration (for protected image file serving)
jwt.secret=${JWT_SECRET:sangrah_secret_key_for_jwt_token_validation_please_change_in_production}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Logging Configuration
logging.level.root=INFO
logging.level.com.example.Gallery=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Eureka Service Discovery Configuration
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.health-check-url-path=/actuator/health
eureka.instance.status-page-url-path=/actuator/info

# Media Service Configuration (Feign Client)
media.service.url=${MEDIA_SERVICE_URL:http://localhost:8087}


# Server Configuration
server.servlet.context-path=/
server.error.include-message=always
server.error.include-binding-errors=always
