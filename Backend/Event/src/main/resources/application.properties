spring.application.name=Event
server.port=${EVENT_PORT:8083}
spring.data.mongodb.uri=${EVENT_MONGODB_URI:mongodb://localhost:27017/sangrah_event}

# Storage Configuration (12-Factor: use environment variables)
sangrah.storage.root=${SANGRAH_STORAGE_ROOT:./storage}

# OpenAPI/Swagger Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Logging Configuration
logging.level.root=INFO
logging.level.com.example.Event=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Eureka Service Discovery Configuration
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=${EUREKA_REGISTER_WITH_EUREKA:true}
eureka.client.fetch-registry=${EUREKA_FETCH_REGISTRY:true}
eureka.instance.prefer-ip-address=${EUREKA_INSTANCE_PREFER_IP_ADDRESS:false}
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.health-check-url-path=${EUREKA_INSTANCE_HEALTH_CHECK_PATH:/actuator/health}
eureka.instance.status-page-url-path=${EUREKA_INSTANCE_STATUS_PAGE_PATH:/actuator/info}

# Media Service Configuration (Feign Client)
media.service.url=${MEDIA_SERVICE_URL:http://localhost:8087}

# Auth Service Configuration (RestTemplate Client)
# For Docker: use container name "auth"
# For localhost: use "localhost" with correct port
auth.service.url=${AUTH_SERVICE_URL:http://localhost:8081}

# File Upload Configuration
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
spring.webflux.multipart.max-file-size=500MB
spring.webflux.multipart.max-in-memory-size=10485760

# Server Configuration
server.servlet.context-path=/
server.error.include-message=always
server.error.include-binding-errors=always

# Orphaned Media Reconciliation Scheduler
event.media.reconciliation.enabled=${EVENT_MEDIA_RECONCILIATION_ENABLED:true}
event.media.reconciliation.cron=${EVENT_MEDIA_RECONCILIATION_CRON:0 */5 * * * *}
event.media.reconciliation.max-retries=${EVENT_MEDIA_RECONCILIATION_MAX_RETRIES:5}
