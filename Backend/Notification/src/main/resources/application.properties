spring.application.name=Notification
server.port=${NOTIFICATION_PORT:8085}
spring.data.mongodb.uri=${NOTIFICATION_MONGODB_URI:mongodb://localhost:27017/sangrah_notification}

# Security & Header Configuration
notification.header.user-id=${NOTIFICATION_HEADER_USER_ID:X-User-Id}

# Pagination Configuration
notification.pagination.default-skip=${NOTIFICATION_PAGINATION_DEFAULT_SKIP:0}
notification.pagination.default-limit=${NOTIFICATION_PAGINATION_DEFAULT_LIMIT:50}
notification.pagination.min-skip=${NOTIFICATION_PAGINATION_MIN_SKIP:0}
notification.pagination.min-limit=${NOTIFICATION_PAGINATION_MIN_LIMIT:1}
notification.pagination.max-limit=${NOTIFICATION_PAGINATION_MAX_LIMIT:100}

# Notification Preferences Default Configuration
notification.preference.default-in-app-enabled=${NOTIFICATION_PREF_DEFAULT_IN_APP:true}
notification.preference.default-email-enabled=${NOTIFICATION_PREF_DEFAULT_EMAIL:false}

# Error Handling Configuration (RFC-9457 ProblemDetail base URL)
sangrah.api.error-type-base-url=${ERROR_TYPE_BASE_URL:https://api.sangrah.com/errors}

# OpenAPI/Swagger Configuration
springdoc.api-docs.path=${SPRINGDOC_API_DOCS_PATH:/api-docs}
springdoc.swagger-ui.path=${SPRINGDOC_SWAGGER_UI_PATH:/swagger-ui}
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Logging Configuration
logging.level.root=${LOGGING_LEVEL_ROOT:INFO}
logging.level.com.example.Notification=${LOGGING_LEVEL_NOTIFICATION:DEBUG}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Eureka Service Discovery Configuration
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=${EUREKA_CLIENT_REGISTER_WITH_EUREKA:true}
eureka.client.fetch-registry=${EUREKA_CLIENT_FETCH_REGISTRY:true}
eureka.instance.prefer-ip-address=${EUREKA_INSTANCE_PREFER_IP_ADDRESS:true}
eureka.instance.health-check-url-path=${EUREKA_INSTANCE_HEALTH_CHECK_PATH:/actuator/health}
eureka.instance.status-page-url-path=${EUREKA_INSTANCE_STATUS_PAGE_PATH:/actuator/info}

# Server Configuration
server.servlet.context-path=/
server.error.include-message=always
server.error.include-binding-errors=always
