# Spring Boot Configuration
spring.application.name=MediaService
server.port=${MEDIA_PORT:8087}

# MongoDB Configuration
spring.data.mongodb.uri=${MEDIA_MONGODB_URI:mongodb://localhost:27017/sangrah_media}
spring.data.mongodb.auto-index-creation=true

# Eureka Service Discovery
eureka.client.serviceUrl.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.instance.hostname=${MEDIA_HOSTNAME:localhost}
eureka.instance.instance-id=${spring.application.name}:${server.port}

# File Upload Configuration
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:500MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:500MB}
spring.webflux.multipart.max-file-size=${MAX_FILE_SIZE:500MB}
spring.webflux.multipart.max-in-memory-size=${MAX_IN_MEMORY_SIZE:10485760}

# Media Storage Configuration
sangrah.storage.root=${SANGRAH_STORAGE_ROOT:./storage}

# Storage Limit Configuration
storage.limit.bytes=${STORAGE_LIMIT_BYTES:5368709120}
sangrah.storage.provider=${SANGRAH_STORAGE_PROVIDER:LOCAL}

# Media Async Thread Pool Configuration
media.async.core-pool-size=${MEDIA_ASYNC_CORE_POOL_SIZE:5}
media.async.max-pool-size=${MEDIA_ASYNC_MAX_POOL_SIZE:20}
media.async.queue-capacity=${MEDIA_ASYNC_QUEUE_CAPACITY:2000}
media.async.thread-name-prefix=${MEDIA_ASYNC_THREAD_PREFIX:media-purge-}

# Media Storage Garbage Collection (Fallback for In-Memory Async Deletion)
media.gc.enabled=${MEDIA_GC_ENABLED:true}
media.gc.cron=${MEDIA_GC_CRON:0 0 2 * * *}
media.gc.retention-days=${MEDIA_GC_RETENTION_DAYS:30}
media.gc.batch-size=${MEDIA_GC_BATCH_SIZE:500}

# JWT Configuration
jwt.secret=${JWT_SECRET:your-secret-key-change-in-production}
jwt.expiration=${JWT_EXPIRATION_MS:3600000}

# Logging
logging.level.root=INFO
logging.level.com.example.Media=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# OpenAPI/Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
